<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="LOOP logo">
  <!-- LOOP visual identity: graphite / violet / cyan -->
  <defs>
    <linearGradient id="loopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" rx="48" fill="#16161C"/>
  <!-- iteration loop mark: a rounded circuit loop with a direction gap -->
  <g fill="none" stroke="url(#loopGrad)" stroke-linecap="round">
    <path d="M 76 148 V 96 a 28 28 0 0 1 28 -28 h 52 a 28 28 0 0 1 28 28 v 52 a 28 28 0 0 1 -28 28 H 96"
          stroke-width="16"/>
  </g>
  <!-- arrowhead closing the loop (clockwise) -->
  <path d="M 94 176 L 112 166 L 112 186 Z" fill="#22D3EE"/>
  <!-- node dot where the loop passes the top-left corner -->
  <circle cx="76" cy="148" r="9" fill="#8B5CF6"/>
  <text x="120" y="215" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="10" fill="#FFFFFF">LOOP</text>
</svg>
