name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Structural validation
        run: node scripts/validate.mjs

      - name: Self-test (validator must catch broken copies)
        run: node scripts/validate.mjs --self-test

      - name: Behavioral harness self-test (free - fixtures, checks, parser regressions; no model calls)
        run: node tests/harness/selftest.mjs

      - name: Installer tests (temporary directories only)
        run: node scripts/validate.mjs --install-test
